<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Agentic Probe — paper, 1 October 2026</title>
<meta name="description" content="The Agentic Probe: The Instrument of Agentic Discovery &amp; Engineering — the paper (edition of 1 October 2026). Select text to leave a comment." />
<link rel="preconnect" href="https://accounts.google.com" />
<link rel="stylesheet" href="./reader.css?v=2026-10-01.mupuy34w" />
<script src="./config.js?v=2026-10-01.mupuy34w"></script>
<script>
  // MyPublicAnalytics beacon bootstrap (site='Agentic-Probe'). The beacon sends the
  // pageview; activity.js adds every reader action on top of it.
  (function (c) { if (!c || c.analytics === false) return;
    window.__MYPA_SITE__ = c.site || 'Agentic-Probe';
    // No analytics from local tests (file://, localhost); the published page sends.
    window.__MYPA_ENDPOINT__ = (location.protocol === 'file:' || /^(localhost|127\.)/.test(location.hostname)) ? '' : (c.collectEndpoint || '');
    window.__MYPA_IDENTITY_KEY__ = c.identityKey || 'unitas:identity';
    window.__MYPA_EXTRA__ = { surface: 'paper', v: c.edition || 'dev' };
  })(window.PHD_VIEWER_CONFIG);
</script>
<script src="./vendor/mypa/analytics.js" defer></script>
</head>
<body>

<div id="bar">
  <div class="title" id="barTitle"><a href="../" title="Back to the narrated talk">The Agentic Probe</a> · paper, 1 Oct 2026</div>
  <div class="grp links"><a class="btn" href="../" id="lnkTalk" title="The narrated talk">▶ Talk</a><a class="btn" href="../slides.html" id="lnkSlides" title="The slides">▤ Slides</a><a class="btn" id="lnkPdf" href="./agentic-probe-2026-10-01.pdf" download title="Download the PDF">⤓ PDF</a></div>
  <div class="grp">
    <button class="btn" id="prev" title="Previous page">‹</button>
    <input id="pageInput" value="1" inputmode="numeric" aria-label="Page" />
    <span id="pageTotal">/ …</span>
    <button class="btn" id="next" title="Next page">›</button>
  </div>
  <div class="grp" id="zoomGrp">
    <button class="btn" id="back" title="Back (Alt+←) — return to where you followed a link" disabled>↩</button>
    <button class="btn" id="zout" title="Zoom out (⌘/Ctrl −)">−</button>
    <button class="btn zlabel" id="zfit" title="Fit width (⌘/Ctrl 0)"><span id="zlabel">100 %</span></button>
    <button class="btn" id="zin" title="Zoom in (⌘/Ctrl +)">+</button>
  </div>
  <button class="btn" id="srchBtn" title="Search the text (⌘/Ctrl F)">🔍</button>
  <button class="btn" id="ownerBtn" title="All readers' comments (owner only)" style="display:none">🗂 Comments <span id="ownerN" class="n">0</span></button>
  <button class="btn primary" id="cmtPage" title="Comment on the current page">💬 Comment on page</button>
  <div id="who" style="display:none"></div>
  <div id="gbtn"></div>
</div>

<!-- full-text search panel -->
<div id="search" role="search" aria-label="Search">
  <div class="row">
    <input id="srchInput" type="search" placeholder="Search the paper…" autocomplete="off" spellcheck="false" aria-label="Search term" />
    <span id="srchCount" aria-live="polite"></span>
    <button class="btn" id="srchPrev" title="Previous match (Shift+Enter)">▲</button>
    <button class="btn" id="srchNext" title="Next match (Enter)">▼</button>
    <button class="btn" id="srchClose" title="Close (Esc)">✕</button>
  </div>
  <div id="srchList"></div>
</div>

<!-- owner-only: all readers' comments -->
<div id="owner" role="region" aria-label="All comments">
  <div class="row">
    <strong>All comments</strong>
    <span id="ownerCount" class="cnt"></span>
    <input id="ownerFilter" type="search" placeholder="Filter: name, text, p. 19…" autocomplete="off" aria-label="Filter comments" />
    <button class="btn" id="ownerReload" title="Refresh">↻</button>
    <button class="btn" id="ownerClose" title="Close (Esc)">✕</button>
  </div>
  <div id="ownerStatus" class="status"></div>
  <div id="ownerList"></div>
</div>

<div id="stage">
  <div id="pages"></div>
  <div id="loading"><div class="bar"><i></i></div><div>Loading the paper…</div></div>
</div>

<!-- floating "add comment on selection" button -->
<button id="fab" title="Comment on the selection">💬 Comment</button>

<!-- comment composer -->
<div id="composer" role="dialog" aria-modal="false" aria-label="Comment">
  <h3 id="cmtCtx">Comment</h3>
  <div class="quote" id="cmtQuote" style="display:none"></div>
  <div id="cmtSigninNote" class="signin-note" style="display:none">
    Sign in with Google (top right) to leave a comment, so the authors know who the feedback is from.
  </div>
  <div class="row">
    <select id="cmtCat" aria-label="Comment type">
      <option value="general">General remark</option>
      <option value="typo">Typo / language</option>
      <option value="content">Content / argument</option>
      <option value="question">Question</option>
      <option value="suggestion">Suggestion</option>
    </select>
    <button class="iconbtn" id="cmtMic" type="button" title="Dictate the comment">🎤 Dictate</button>
    <button class="iconbtn" id="cmtRec" type="button" title="Record the comment">● Record</button>
    <span id="dictindicator">● listening…</span>
  </div>
  <textarea id="cmtText" placeholder="Type or dictate your comment here…"></textarea>
  <div class="row end">
    <span class="hint" style="margin-right:auto">Comments go to the authors only; they are not shown publicly.</span>
    <button class="cancel" id="cmtCancel" type="button">Cancel</button>
    <button class="send" id="cmtSend" type="button">Send</button>
  </div>
</div>

<div id="toast">&nbsp;</div>

<script>
  // Agentic Probe: downloads and links back to the talk / slides (activity.js tracks the reading itself).
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('#lnkPdf, #lnkTalk, #lnkSlides, #barTitle a');
    if (!a || !window.mypa || !window.mypa.send) return;
    if (a.id === 'lnkPdf') window.mypa.send('download', { what: 'pdf' });
    else window.mypa.send('nav_out', { to: a.id === 'lnkSlides' ? 'slides' : 'player' });
  }, true);
</script>
<script type="module" src="./reader.js?v=2026-10-01.mupuy34w"></script>
</body>
</html>
